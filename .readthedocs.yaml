version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  apt_packages:
    - fonts-liberation
    - fonts-noto-cjk
    - fonts-noto-cjk-extra
    - texlive-lang-chinese
    - texlive-lang-japanese
    - texlive-xetex
    - texlive-latex-extra
    - latexmk
    - librsvg2-bin

python:
  install:
    - requirements: "V01-α/requirements.txt"

sphinx:
  configuration: "V01-α/source/conf.py"

formats:
  - pdf
